name: HTTP Proxy Server

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Keep proxy alive for (hours)"
        required: false
        default: "6"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "6"
          - "12"

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    env:
      NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y tinyproxy curl jq ca-certificates

          curl -fsSL \
            https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            -o /tmp/ngrok.tgz

          sudo tar -xzf /tmp/ngrok.tgz -C /usr/local/bin
          sudo chmod +x /usr/local/bin/ngrok
          ngrok version

      - name: Create tinyproxy config
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p /etc/tinyproxy
          sudo tee /etc/tinyproxy/tinyproxy.conf >/dev/null <<'EOF'
          Port 8888
          Listen 127.0.0.1
          Timeout 600
          DefaultErrorFile "/usr/share/tinyproxy/default.html"
          StatFile "/usr/share/tinyproxy/stats.html"
          Logfile "/var/log/tinyproxy/tinyproxy.log"
          LogLevel Info
          PidFile "/var/run/tinyproxy/tinyproxy.pid"
          MaxClients 100
          MinSpareServers 5
          MaxSpareServers 20
          StartServers 10
          MaxRequestsPerChild 0
          ViaProxyName "tinyproxy"
          ConnectPort 443
          ConnectPort 80
          EOF

      - name: Start tinyproxy
        shell: bash
        run: |
          set -euxo pipefail

          sudo tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf >/tmp/tinyproxy.log 2>&1 &
          sleep 3

          if ! pgrep -x tinyproxy >/dev/null; then
            echo "Tinyproxy failed to start"
            cat /tmp/tinyproxy.log || true
            exit 1
          fi

          echo "✓ Tinyproxy started"

      - name: Start ngrok tunnel
        shell: bash
        run: |
          set -euxo pipefail

          if [ -z "${NGROK_TOKEN:-}" ]; then
            echo "NGROK_TOKEN is not configured"
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_TOKEN"
          ngrok tcp 8888 > /tmp/ngrok.log 2>&1 &
          sleep 10

          ENDPOINT=""
          for i in $(seq 1 30); do
            ENDPOINT=$(curl -fsS http://127.0.0.1:4040/api/tunnels 2>/dev/null \
              | jq -r '.tunnels[] | select(.proto == "tcp") | .public_url' 2>/dev/null \
              | head -n 1 || true)

            if [ -n "$ENDPOINT" ] && [ "$ENDPOINT" != "null" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "${ENDPOINT:-}" ] || [ "$ENDPOINT" = "null" ]; then
            echo "ngrok failed"
            cat /tmp/ngrok.log || true
            exit 1
          fi

          PUBLIC_URL="${ENDPOINT#tcp://}"
          PUBLIC_HOST="${PUBLIC_URL%:*}"
          PUBLIC_PORT="${PUBLIC_URL##*:}"

          if [ "$PUBLIC_PORT" = "$PUBLIC_HOST" ]; then
            PUBLIC_PORT="8888"
          fi

          echo "PROXY_HOST=${PUBLIC_HOST}" >> "$GITHUB_ENV"
          echo "PROXY_PORT=${PUBLIC_PORT}" >> "$GITHUB_ENV"
          echo "PROXY_ENDPOINT=${ENDPOINT}" >> "$GITHUB_ENV"

      - name: Display proxy details
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "✓ HTTP PROXY READY"
          echo "=========================================="
          echo ""
          echo "Proxy: $PROXY_HOST:$PROXY_PORT"
          echo "URL: $PROXY_ENDPOINT"
          echo ""
          echo "Browser: Set HTTP proxy to $PROXY_HOST port $PROXY_PORT"
          echo "curl: curl -x http://$PROXY_HOST:$PROXY_PORT https://myip.com"
          echo ""
          echo "=========================================="
          echo ""

      - name: Keep alive
        shell: bash
        timeout-minutes: 710
        run: |
          set -euxo pipefail

          DURATION_HOURS="${{ inputs.duration_hours }}"
          [ -z "$DURATION_HOURS" ] && DURATION_HOURS="6"

          DURATION_SECONDS=$((DURATION_HOURS * 3600))
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + DURATION_SECONDS))

          echo "Proxy running for $DURATION_HOURS hour(s)..."
          echo ""

          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 30

            if ! pgrep -x tinyproxy >/dev/null; then
              echo "[$(date +'%H:%M:%S')] Restarting tinyproxy..."
              sudo tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf >/tmp/tinyproxy.log 2>&1 &
              sleep 2
            fi

            if ! pgrep -x ngrok >/dev/null; then
              echo "[$(date +'%H:%M:%S')] Restarting ngrok..."
              ngrok tcp 8888 > /tmp/ngrok.log 2>&1 &
              sleep 5
            fi

            ELAPSED=$(($(date +%s) - START_TIME))
            REMAINING=$((DURATION_SECONDS - ELAPSED))
            REMAINING_HOURS=$((REMAINING / 3600))
            REMAINING_MINS=$(((REMAINING % 3600) / 60))

            echo "[$(date +'%H:%M:%S')] Proxy online | Host: $PROXY_HOST:$PROXY_PORT | Remaining: ${REMAINING_HOURS}h ${REMAINING_MINS}m"
          done

          echo ""
          echo "✓ Proxy session ended"
